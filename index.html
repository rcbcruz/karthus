<style>
  /* Guia do Karthus do polgarlol. A mesma página serve para ver (GitHub Pages) e para editar:
     - no PC (http://127.0.0.1:7730, servida pelo karthus_bot.py) já abre editando;
     - na internet, "Editar" pede a chave do GitHub do dono da página (fica só naquele aparelho).
     Dados: data.json (bot: partida, runas, build, stats) e matchups.json (as anotações), no ramo "dados" do repositório. */
  :root { --borda: #f1c27a; --acento: #d3233a; --texto: #f3e4d2; --fundo1: #240916; --fundo2: #10050c; --brilho: rgba(211, 35, 58, .55);
          --nome1: #b9772c; --nome2: #fff4dc; --nome3: #f1c27a; --fundo: #0d0709; --painel: #160d12; --painel2: #1e1319; --linha: #2c1d25;
          --suave: #a8959f; --fraco: #75656e; --d1: #4fbf7f; --d2: #a3c95a; --d3: #e0b84c; --d4: #e4793a; --d5: #e0405a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--fundo); }
  /* textos corridos em Inter (lê melhor em parágrafo); rótulos e botões em Rajdhani; títulos em Cinzel */
  body { color: var(--texto); font: 400 15.5px/1.6 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---------- fundo vivo: a arte da skin em uso respirando (zoom lento no rosto), névoa, brasas e o pulso do Réquiem ---------- */
  .cena { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--fundo); }
  .cena-arte { position: absolute; inset: -4% -4% -22% -4%; will-change: transform; }
  .cena .arte { position: absolute; inset: 0; background: var(--splash, none) var(--fx, 60%) var(--fy, 25%) / cover no-repeat;
    transform-origin: var(--fx, 60%) var(--fy, 25%); animation: respira 38s ease-in-out infinite alternate; filter: saturate(1.06) contrast(1.04);
    opacity: 0; transition: opacity .45s ease; }
  .cena .arte.ok { opacity: 1; transition-duration: 1.1s; }
  @keyframes respira { from { transform: scale(1.03); } to { transform: scale(1.16) translate(-1%, -.6%); } }
  .nevoa { position: absolute; width: 95vmax; height: 65vmax; border-radius: 50%; filter: blur(70px); opacity: .32; mix-blend-mode: screen; pointer-events: none; }
  .nevoa.n1 { left: -38vmax; bottom: -36vmax; background: radial-gradient(circle, color-mix(in srgb, var(--acento) 60%, transparent), transparent 66%);
    animation: deriva1 30s ease-in-out infinite alternate; }
  .nevoa.n2 { right: -40vmax; top: -30vmax; background: radial-gradient(circle, color-mix(in srgb, var(--borda) 40%, transparent), transparent 66%);
    animation: deriva2 36s ease-in-out infinite alternate; }
  @keyframes deriva1 { to { transform: translate(22vmax, -6vmax) scale(1.12); } }
  @keyframes deriva2 { to { transform: translate(-18vmax, 8vmax) scale(1.18); } }
  #brasas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; pointer-events: none; }
  .cena-veu { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10, 6, 8, .9) 0%, rgba(10, 6, 8, .62) 38%, rgba(10, 6, 8, .25) 64%, rgba(10, 6, 8, .5) 100%),
                linear-gradient(180deg, rgba(10, 6, 8, .05) 0%, rgba(10, 6, 8, .45) 48vh, rgba(10, 6, 8, .86) 92vh); }
  .pulso { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; pointer-events: none;
    background: radial-gradient(ellipse 45% 55% at var(--fx, 60%) var(--fy, 25%), var(--brilho), transparent 70%); animation: requiem 26s ease-in-out infinite; }
  @keyframes requiem { 0%, 86% { opacity: 0; } 90% { opacity: .55; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cena .arte, .nevoa, .pulso { animation: none; } }
  a { color: var(--borda); }
  img { display: block; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--borda); outline-offset: 2px; }
  .rot { font: 700 12px "Rajdhani", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--suave); }
  .vazio { color: var(--suave); }
  .v { color: #6fe0a0; } .d { color: #ff7d8f; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--borda); color: #180f08; font: 700 14px "Rajdhani", sans-serif;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  .btn.sec { background: transparent; color: var(--texto); border: 1px solid var(--linha); }
  .btn.sec:hover { border-color: var(--borda); }
  .btn.perigo { background: transparent; color: #ff8f9d; border: 1px solid rgba(224, 64, 90, .45); }
  .btn.mini { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- cabeçalho fixo no topo desde o início: marca · abas · Twitch (no celular: duas linhas) ---------- */
  :root { --h-cab: 64px; }
  html { scroll-padding-top: calc(var(--h-cab) + 14px); }
  .cabecalho { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--h-cab); display: flex; align-items: center; gap: 16px;
    padding: 0 max(16px, calc((100vw - 1100px) / 2)); background: rgba(10, 6, 8, .55); backdrop-filter: blur(14px) saturate(1.15);
    -webkit-backdrop-filter: blur(14px) saturate(1.15); border-bottom: 1px solid rgba(255, 255, 255, .06); transition: background .3s, box-shadow .3s; }
  .cabecalho:empty { display: none; }
  .cabecalho.rolou { background: rgba(10, 6, 8, .9); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
  .cabecalho .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); flex: none; }
  .cabecalho .marca img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px var(--borda); }
  .cabecalho .marca span { display: grid; line-height: 1.1; }
  .cabecalho .marca small { font: 700 11px "Rajdhani", sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--borda); }
  .cabecalho .marca b { font: 900 16px "Cinzel", serif; letter-spacing: .02em; }
  .abas { flex: 1; display: flex; justify-content: center; align-self: stretch; overflow-x: auto; scrollbar-width: none; }
  .abas::-webkit-scrollbar { display: none; }
  .abas a { display: flex; align-items: center; padding: 0 14px; color: var(--suave); text-decoration: none; font: 700 14px "Rajdhani", sans-serif;
    letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
  .abas a:hover { color: var(--texto); }
  .abas a.on { color: var(--borda); border-bottom-color: var(--borda); }
  /* seletor de tema: a página não segue a skin da live; cada visitante escolhe (padrão: Arcana) */
  .tema-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 3px; flex: none; border: 1px solid var(--linha);
    background: rgba(0, 0, 0, .25); color: var(--texto); font: 700 13px "Rajdhani", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    transition: border-color .2s; }
  .tema-btn img { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 1px var(--borda); }
  .tema-btn:hover, .tema-btn[aria-expanded="true"] { border-color: var(--borda); }
  .temas { position: fixed; z-index: 40; top: calc(var(--h-cab) + 8px); right: max(16px, calc((100vw - 1100px) / 2)); width: min(360px, calc(100vw - 24px));
    padding: 14px; background: color-mix(in srgb, var(--painel2) 96%, transparent); border: 1px solid var(--linha); border-top: 2px solid var(--borda);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .18s, transform .18s, visibility 0s .18s; }
  .temas.aberto { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .temas > .rot { display: block; margin-bottom: 10px; }
  .temas-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .temas-lista button { display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 6px; border: 1px solid transparent; text-align: left;
    font: 600 14px/1.15 "Rajdhani", sans-serif; color: var(--suave); transition: background .15s, color .15s; }
  .temas-lista button:hover { background: rgba(255, 255, 255, .04); color: var(--texto); }
  .temas-lista button.on { border-color: color-mix(in srgb, var(--borda) 60%, transparent); background: color-mix(in srgb, var(--borda) 10%, transparent); color: var(--texto); }
  .temas-lista img { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--tb); }
  .temas-lista small { display: block; font: 700 10px "Rajdhani", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--borda); }
  @media (prefers-reduced-motion: reduce) { .temas { transition: none; } }
  @media (max-width: 760px) {
    :root { --h-cab: 104px; }
    .cabecalho { flex-wrap: wrap; height: var(--h-cab); padding: 0 12px; gap: 0 10px; align-content: flex-start; }
    .cabecalho .marca { height: 58px; }
    .cabecalho .tema-btn { margin-left: auto; padding-right: 3px; }
    .tema-btn span { display: none; }
    .temas { left: 12px; right: 12px; width: auto; }
    .abas { order: 3; flex: 1 0 100%; justify-content: flex-start; height: 46px; margin: 0 -12px; padding: 0 44px 0 2px; border-top: 1px solid rgba(255, 255, 255, .06);
      -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); }
    .abas a { padding: 0 12px; }
  }
  .hero { position: relative; max-width: 960px; margin: 0 auto; padding: calc(var(--h-cab) + 48px) 18px 34px; min-height: min(66vh, 600px);
    display: flex; flex-direction: column; justify-content: flex-end; }
  .hero .sobre { font: 700 13px "Rajdhani", sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--acento); margin-bottom: 10px; }
  .hero .lead { max-width: 560px; margin-top: 14px; font-size: 16.5px; line-height: 1.6; color: color-mix(in srgb, var(--texto) 88%, transparent); }
  .twitch { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; background: #9146ff; color: #fff; font: 700 14px "Rajdhani", sans-serif;
    letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
  .hero h1 { font: 900 clamp(38px, 8.5vw, 62px)/1 "Cinzel", serif; letter-spacing: .02em;
    background: linear-gradient(100deg, var(--nome1), var(--nome3) 30%, var(--nome2) 45%, var(--nome3) 60%, var(--nome1)); -webkit-background-clip: text;
    background-clip: text; color: transparent; filter: drop-shadow(0 0 18px var(--brilho)); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip { padding: 5px 12px; background: rgba(0, 0, 0, .5); border: 1px solid color-mix(in srgb, var(--borda) 45%, transparent);
    font: 600 14.5px "Rajdhani", sans-serif; letter-spacing: .03em; backdrop-filter: blur(6px); }
  .chip b { color: var(--nome2); }
  .aovivo { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; background: #c4122f; color: #fff; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; font-size: 14px; }
  .aovivo i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pisca 1.2s ease-in-out infinite; }
  @keyframes pisca { 50% { opacity: .25; } }
  .runa, .item, .frag, .aovivo, .jogo .res, .time .rot, .rapido .c .n { font-family: "Rajdhani", sans-serif; }
  .modo { position: fixed; right: 14px; bottom: 14px; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--painel2);
    border: 1px solid var(--borda); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-weight: 700; font-size: 14px; }
  .modo i { width: 8px; height: 8px; border-radius: 50%; background: var(--d1); box-shadow: 0 0 8px var(--d1); }

  /* começo da partida, nota da build e referências */
  .campo-ini { display: inline-block; padding: 1px 9px; margin-right: 6px; font: 700 12px "Rajdhani", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--cc, var(--borda)); color: var(--cc, var(--borda)); }
  .campos-ini { display: flex; flex-wrap: wrap; gap: 6px; }
  .campos-ini button { padding: 6px 12px; border: 1px solid var(--linha); font: 700 13px "Rajdhani", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: var(--suave); transition: color .12s, border-color .12s; }
  .campos-ini button:hover { color: var(--texto); }
  .campos-ini button.on { border-color: var(--cc); color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); }
  .nota-build { margin-top: 6px; font-size: 14.5px; color: color-mix(in srgb, var(--texto) 80%, transparent); }
  .bloco-mu { margin-top: 14px; }
  .bloco-mu > .rot { display: block; margin-bottom: 4px; }
  .refs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .ref { padding: 16px 18px; background: color-mix(in srgb, var(--painel) 88%, transparent); border: 1px solid var(--linha); border-top: 3px solid var(--borda);
    backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 8px; }
  .ref-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ref-topo b { font: 900 18px "Cinzel", serif; }
  .ref p { color: color-mix(in srgb, var(--texto) 85%, transparent); font-size: 14.5px; }
  .ref-links { display: flex; gap: 6px; align-items: center; margin-top: auto; flex-wrap: wrap; }
  .rede { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border: 1px solid var(--linha); background: rgba(0, 0, 0, .2);
    color: var(--texto); font: 700 13px "Rajdhani", sans-serif; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; transition: border-color .15s, background .15s; }
  .rede::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rc, var(--borda)); box-shadow: 0 0 8px var(--rc, var(--borda)); }
  .rede:hover { border-color: var(--rc, var(--borda)); background: color-mix(in srgb, var(--rc, var(--borda)) 12%, transparent); }
  .ref.no-ar { border-top-color: #eb0400; box-shadow: 0 0 0 1px rgba(235, 4, 0, .3), 0 12px 34px rgba(235, 4, 0, .14); }
  .vivo-ref { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 3px 9px; background: #c4122f; color: #fff;
    font: 700 11px "Rajdhani", sans-serif; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
  .vivo-ref:hover { background: #e0173a; }
  .vivo-ref i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pisca 1.2s ease-in-out infinite; }
  .visitas { gap: 6px 18px; }
  .visitas .num { font-size: 14px; color: var(--suave); }
  .visitas .num b { font-size: 20px; margin-right: 4px; }
  .barras { margin-left: auto; display: flex; align-items: flex-end; gap: 4px; height: 30px; }
  .barras i { width: 9px; background: var(--borda); opacity: .85; }
  .ref-acoes { display: flex; justify-content: flex-end; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--linha); }
  .redes-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .redes-form label { display: grid; gap: 3px; }
  .redes-form label span { font: 700 12px "Rajdhani", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--rc); }
  @media (max-width: 520px) { .redes-form { grid-template-columns: 1fr; } }

  main { max-width: 960px; margin: 0 auto; padding: 0 16px 60px; overflow-wrap: anywhere; }
  section { padding-top: 34px; }
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h2 { font: 900 24px "Cinzel", serif; color: var(--texto); }
  .sub { color: var(--suave); font-size: 15px; }
  .painel { background: linear-gradient(180deg, var(--fundo1), var(--fundo2)); border: 1px solid color-mix(in srgb, var(--borda) 40%, transparent); padding: 18px;
    backdrop-filter: blur(8px); }
  h2 + .sub, .cab .sub { max-width: 620px; }

  .runas { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 640px) { .runas { grid-template-columns: 1.3fr 1fr; } }
  .arvore { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font: 700 16px "Rajdhani", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--borda); }
  .arvore img { width: 28px; height: 28px; }
  .chave { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .chave img { width: 80px; height: 80px; filter: drop-shadow(0 0 12px var(--brilho)); }
  .chave b { font: 900 21px/1.15 "Cinzel", serif; color: var(--nome2); }
  .runa { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-weight: 600; font-size: 17px; }
  .runa img { width: 38px; height: 38px; border-radius: 50%; background: #000; box-shadow: 0 0 0 1px color-mix(in srgb, var(--borda) 40%, transparent); }
  .frag { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--linha); font-size: 14px; color: var(--suave); }
  .frag span { display: inline-flex; align-items: center; gap: 6px; }
  .frag img { width: 22px; height: 22px; border-radius: 50%; background: #000; }

  .itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
  .item { display: flex; align-items: center; gap: 10px; font-weight: 600; line-height: 1.2; min-width: 0; }
  .item img { width: 48px; height: 48px; border-radius: 6px; flex: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--borda) 50%, transparent); }
  .item small { display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--acento); }

  /* matchups */
  .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--linha); }
  .seg button { padding: 7px 14px; color: var(--suave); font: 700 14px "Rajdhani", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .seg button.on { color: var(--borda); background: var(--painel2); }
  .busca { flex: 1; min-width: 180px; padding: 9px 14px; background: var(--painel); border: 1px solid var(--linha); }
  .nivel { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .nivel:last-child { border-bottom: 0; }
  .nivel .nome { width: 104px; flex: none; padding-top: 8px; font: 700 14px "Rajdhani", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--cor); }
  .nivel .camps { display: flex; flex-wrap: wrap; gap: 6px; }
  .nivel a img { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 2px var(--cor); }
  .mus { display: grid; gap: 12px; margin-top: 14px; }
  .mu { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 18px; background: color-mix(in srgb, var(--painel) 88%, transparent);
    border: 1px solid var(--linha); border-left: 4px solid var(--cor); backdrop-filter: blur(8px); }
  .mu.alvo { box-shadow: 0 0 0 2px var(--borda), 0 0 30px var(--brilho); }
  .mu > img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 2px var(--cor); }
  .mu.curto { grid-template-columns: 44px 1fr; align-items: center; padding: 12px 18px; }   /* só a dificuldade, guia ainda não escrito */
  .mu.curto > img { width: 44px; height: 44px; }
  .mu.curto h3 { font-size: 18px; }
  .mu .em-breve { font-size: 14px; margin-top: 2px; }
  .mu .topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mu h3 { font: 900 20px "Cinzel", serif; }
  .tag { padding: 1px 8px; font: 700 12px "Rajdhani", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .tag.nv { background: var(--cor); color: #140c08; }

  .agora-num { display: flex; flex-wrap: wrap; gap: 10px 26px; }

  .times { display: grid; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linha); }

  .gaveta { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(560px, 100vw); padding: 0; border-width: 0 0 0 1px; }

  .esc { display: flex; flex-wrap: wrap; gap: 6px; }

  .escolhido { font-size: 14px; color: var(--suave); margin-top: 6px; min-height: 18px; }

  .conta-car { text-align: right; font-size: 12px; color: var(--fraco); margin-top: 4px; }
  .build-sel { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 8px; background: var(--painel2); border: 1px dashed var(--linha); }
  .build-sel .it { position: relative; }

  .build-sel .it .ord { position: absolute; left: -4px; top: -6px; background: var(--borda); color: #140c08; font: 700 11px "Rajdhani"; padding: 0 4px; }
  .build-sel .it .ctl { display: flex; justify-content: space-between; margin-top: 2px; }
  .build-sel .it .ctl button { font-size: 12px; color: var(--suave); padding: 0 3px; }
  .resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; max-height: 260px; overflow: auto; }
  .resultados button { display: flex; align-items: center; gap: 8px; padding: 5px; text-align: left; background: var(--painel2); border: 1px solid transparent; font-size: 13px; line-height: 1.15; }
  .resultados button:hover { border-color: var(--borda); }

  .janela { width: min(560px, calc(100vw - 24px)); padding: 22px; margin: auto; }
  .janela h3 { font: 900 20px "Cinzel", serif; color: var(--borda); margin-bottom: 10px; }
  .janela p, .janela ol { color: var(--suave); margin-bottom: 10px; }

  .janela code { background: var(--painel2); color: var(--texto); padding: 1px 6px; }
  .janela .linha-form { display: flex; gap: 8px; margin-top: 10px; }
  .codigo { font: 900 32px "Cinzel", serif; letter-spacing: .12em; text-align: center; padding: 12px; background: var(--painel2); margin: 10px 0; }
  .erro { color: #ff8f9d; margin-top: 8px; }
  .escolher { width: min(860px, calc(100vw - 24px)); height: min(80vh, 760px); padding: 0; margin: auto; }
  .escolher[open] { display: flex; flex-direction: column; }
  .escolher .barra { padding: 14px 16px 0; }
  .escolher .grade { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; padding: 14px 16px 20px; align-content: start; }
  .escolher .grade button { padding: 8px 4px; background: var(--painel2); border: 1px solid transparent; text-align: center; font-size: 13px; position: relative; }
  .escolher .grade button:hover { border-color: var(--borda); }
  .escolher .grade img { width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 4px; }
  .escolher .grade .marca { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--cor); }
  .secao-config { padding: 14px 0; border-top: 1px solid var(--linha); }
  .secao-config:first-of-type { border-top: 0; }
  .secao-config h4 { font: 700 15px "Rajdhani", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--texto); margin-bottom: 6px; }
  .aviso { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; z-index: 50; padding: 10px 16px;
    background: var(--painel2); border: 1px solid var(--borda); font-weight: 700; pointer-events: none; }
  .aviso.ver { opacity: 1; transform: translateX(-50%); }

    .mu { grid-template-columns: 48px 1fr; padding: 14px; }

</style>

<body>
<div class="cena" aria-hidden="true">
  <div class="cena-arte" id="cena-arte"><div class="arte" id="arte"></div></div>
  <div class="nevoa n1"></div><div class="nevoa n2"></div>
  <div class="pulso"></div>
  <canvas id="brasas"></canvas>
  <div class="cena-veu"></div>
</div>
<header class="cabecalho" id="cabecalho"></header>
<div class="temas" id="temas" role="dialog" aria-label="Tema da página"></div>
<div id="app" class="carregando">carregando…</div>

<dialog id="dlg-editor" class="gaveta" aria-label="Editar matchup"></dialog>
<dialog id="dlg-ref" class="janela" aria-label="Referência"></dialog>
<dialog id="dlg-escolher" class="escolher" aria-label="Escolher campeão"></dialog>
<dialog id="dlg-entrar" class="janela" aria-label="Entrar no modo de edição"></dialog>
<dialog id="dlg-config" class="janela" aria-label="Configurações"></dialog>
<div class="aviso" id="aviso" role="status"></div>

<script>
  // ============================================================ ambiente e utilidades
  const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
  const REPO = LOCAL ? null : { dono: location.hostname.split(".")[0], nome: location.pathname.split("/").filter(Boolean)[0] || "karthus" };
  const CD = "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global";
  const COR = { 1: "var(--d1)", 2: "var(--d2)", 3: "var(--d3)", 4: "var(--d4)", 5: "var(--d5)" };
  const NIVEL = { 1: "fácil", 2: "tranquila", 3: "média", 4: "difícil", 5: "pesadelo" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const img = (x, cls = "", extra = "") => x && x.icone ? `<img class="${cls}" src="${esc(x.icone)}" alt="${esc(x.nome || "")}" title="${esc(x.nome || "")}" loading="lazy" ${extra}>` : "";
  const iconeCampeao = id => `${CD}/default/v1/champion-icons/${id}.png`;
  const iconeCD = caminho => caminho ? `${CD}/default/${caminho.replace(/^\/lol-game-data\/assets\//i, "").toLowerCase()}` : "";
  const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const pct = (v, t) => Math.round(v / Math.max(1, t) * 100);
  const guardar = { ler: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                    gravar: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  function avisar(txt) {
    const a = $("#aviso"); a.textContent = txt; a.classList.add("ver");
    clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.remove("ver"), 2600);
  }
  function haQuanto(seg) {
    const m = Math.max(0, Math.round((Date.now() / 1000 - seg) / 60));
    return m < 1 ? "agora mesmo" : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} dias`;
  }
  const b64e = s => { let x = ""; new TextEncoder().encode(s).forEach(c => { x += String.fromCharCode(c); }); return btoa(x); };
  const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

  // ============================================================ acesso aos dados (PC: servidor do bot · internet: GitHub)
  let token = LOCAL ? null : guardar.ler("karthus.token");
  let EDITAR = LOCAL;
  const api = (caminho, corpo) => fetch(caminho, corpo === undefined ? { cache: "no-store" } :
    { method: "POST", headers: { "Content-Type": "application/json", "X-Karthus": "1" }, body: JSON.stringify(corpo) }).then(r => r.json());
  function gh(caminho, op = {}, comChave = true) {
    const h = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(op.headers || {}) };
    if (comChave && token) h.Authorization = `Bearer ${token}`;
    return fetch("https://api.github.com" + caminho, { ...op, headers: h, cache: op.cache || "no-cache" });
  }
  async function arquivoDoRepo(nome) {   // API (revalida com ETag: respostas 304 não contam no limite) e, se falhar, o CDN
    try {
      const r = await gh(`/repos/${REPO.dono}/${REPO.nome}/contents/${nome}?ref=dados`, { headers: { Accept: "application/vnd.github.raw+json" } }, !!token);
      if (r.ok) return r.json();
      if (r.status === 404) return null;
    } catch (e) {}
    const r = await fetch(`https://raw.githubusercontent.com/${REPO.dono}/${REPO.nome}/dados/${nome}?t=${Math.floor(Date.now() / 60000)}`);
    return r.ok ? r.json() : null;
  }
  const carregarDados = () => LOCAL ? api("/api/publico") : arquivoDoRepo("data.json");
  const carregarMatchups = async () => (LOCAL ? await api("/api/matchups") : await arquivoDoRepo("matchups.json")) || {};

  async function salvarMatchups(mudancas) {   // {id: entrada ou null (apagar)} -> todas as matchups depois de salvar
    if (LOCAL) return api("/api/matchups", { mudancas });
    const caminho = `/repos/${REPO.dono}/${REPO.nome}/contents/matchups.json`;
    for (let tentativa = 0; tentativa < 3; tentativa++) {
      const r = await gh(`${caminho}?ref=dados`, { cache: "no-store" });
      let atual = {}, sha;
      if (r.ok) { const j = await r.json(); sha = j.sha; atual = JSON.parse(b64d(j.content) || "{}"); }
      else if (r.status !== 404) throw new Error(`O GitHub respondeu ${r.status} ao ler as matchups.`);
      const agora = new Date().toISOString().replace(/\.\d+Z$/, "Z");
      for (const [id, e] of Object.entries(mudancas)) atual[id] = e ? { ...e, atualizado: agora } : { apagado: true, atualizado: agora };
      const ordenado = Object.fromEntries(Object.entries(atual).sort((a, b) => (+a[0] || 0) - (+b[0] || 0)));
      const p = await gh(caminho, { method: "PUT", cache: "no-store", body: JSON.stringify({ message: "matchups (editado pela página)",
        content: b64e(JSON.stringify(ordenado, null, 1)), branch: "dados", ...(sha ? { sha } : {}) }) });
      if (p.ok) return ordenado;
      if (p.status === 401 || p.status === 403) throw new Error("Essa chave não pode gravar no repositório (precisa de Contents: Read and write).");
      if (![409, 422].includes(p.status)) throw new Error(`O GitHub respondeu ${p.status} ao salvar.`);
    }
    throw new Error("Outro salvamento aconteceu ao mesmo tempo. Tente de novo.");
  }

  // ============================================================ estado
  let D = null, MU = {}, JG = new Set(), filtroMu = null, rapido = false;
  const matchups = () => Object.entries(MU).filter(([, m]) => m && !m.apagado && m.campeao).map(([id, m]) => ({ id: +id, ...m }));
  const ehJungler = id => JG.has(+id);
  const referencias = () => (MU._referencias && MU._referencias.lista) || [];
  const CAMPOS = { azul: ["Azul", "#5aa9ff", "no Azul"], vermelho: ["Vermelho", "#ff6a5a", "no Vermelho"], sapo: ["Sapo", "#7fd17a", "no Sapo"],
                   lobos: ["Lobos", "#b8c2cc", "nos Lobos"], galinhas: ["Galinhas", "#e7b75e", "nas Galinhas"], golens: ["Golens", "#c9a27e", "nos Golens"] };
  const REGIOES = ["br", "na", "euw", "eune", "kr", "jp", "lan", "las", "oce", "tr", "ru", "me", "sg", "tw", "vn"];

  // ============================================================ visualização
  function cartaoMu(m, semId) {
    const c = m.campeao, r = m.runas || {}, id = c.id;
    const runas = r.chave ? `<div><span class="rot">runas</span><div class="icones">${img(r.chave, "r chv")}${(r.primarias || []).map(x => img(x, "r p")).join("")}
      ${r.secundaria ? `<span class="sep"></span>${img(r.secundaria, "r p")}${(r.secundarias || []).map(x => img(x, "r p")).join("")}` : ""}
      ${(r.fragmentos || []).length ? `<span class="sep"></span>${r.fragmentos.map(x => img(x, "r p", 'style="width:18px;height:18px"')).join("")}` : ""}</div></div>` : "";
    const nomeR = r.chave ? `${esc(r.chave.nome)}${r.secundaria ? ` + ${esc(r.secundaria.nome)}` : ""}` : "";
    const ini = m.inicio || {};
    const soNota = !m.sem_nota && !(m.feiticos || []).length && !r.chave && !(m.itens || []).length && !m.plano && !m.dica && !m.build_nota && !ini.campo && !ini.texto;
    return `<article class="mu${soNota ? " curto" : ""}" ${semId ? "" : `id="vs-${id}"`} data-nome="${esc(semAcento(c.nome))}" style="--cor:${COR[m.dificuldade] || "var(--borda)"}">
      <img src="${iconeCampeao(id)}" alt="" loading="lazy"><div>
        <div class="topo"><h3>${esc(c.nome)}</h3>${m.dificuldade ? `<span class="tag nv">${NIVEL[m.dificuldade]}</span>` : ""}${ehJungler(id) ? `<span class="tag jg">jungler</span>` : ""}
          <span class="acoes">${semId || soNota ? "" : `<button class="btn sec mini" data-copiar="${id}" title="Copiar o link deste guia">link</button>`}
          ${EDITAR ? `<button class="btn mini" data-editar="${id}">${m.sem_nota || soNota ? "escrever guia" : "editar"}</button>` : ""}</span></div>
        ${m.sem_nota ? `<p class="vazio" style="margin-top:6px">O guia dessa matchup ainda não foi escrito.</p>` : ""}
        ${soNota ? `<p class="vazio em-breve">${EDITAR ? "Só a dificuldade por enquanto." : "Guia completo em breve."}</p>` : ""}
        ${blocoInicio(m.inicio)}
        ${(m.feiticos || []).length || runas ? `<div class="grupo">
          ${(m.feiticos || []).length ? `<div><span class="rot">feitiços</span><div class="icones">${m.feiticos.map(f => img(f)).join("")}</div></div>` : ""}${runas}</div>` : ""}
        ${nomeR ? `<div class="vazio" style="font-size:14px;margin-top:4px">${nomeR}</div>` : ""}
        ${(m.itens || []).length || m.build_nota ? `<div class="bloco-mu"><span class="rot">build para essa matchup</span>
          ${(m.itens || []).length ? `<div class="icones">${m.itens.map(i => img(i)).join('<span class="seta">›</span>')}</div>` : ""}
          ${m.build_nota ? `<div class="nota-build">${esc(m.build_nota)}</div>` : ""}</div>` : ""}
        ${m.plano ? `<div class="plano"><span class="rot">o que fazer</span>${esc(m.plano)}</div>` : ""}
        ${m.dica ? `<div class="dica">${esc(m.dica)}</div>` : ""}
      </div></article>`;
  }
  function blocoInicio(ini) {   // "começo da partida": campo onde começar + rota do clear
    if (!ini || (!ini.campo && !ini.texto)) return "";
    const c = CAMPOS[ini.campo];

  function opgg(r) {
    const [nome, tag] = r.nick.split("#");

  }
  // redes de cada referência: guarda só o @ (aceita colar o link inteiro) e monta o link na hora de mostrar
  const REDES = {
    twitch:    { nome: "Twitch",    cor: "#a970ff", url: h => `https://www.twitch.tv/${h}`,     de: /twitch\.tv\/([^/?#\s]+)/i,             ok: /^\w{3,25}$/ },
    youtube:   { nome: "YouTube",   cor: "#ff4e45", url: h => `https://www.youtube.com/@${h}`,  de: /youtube\.com\/@([^/?#\s]+)/i,          ok: /^[\w.-]{3,30}$/ },
    x:         { nome: "X",         cor: "#e7e9ea", url: h => `https://x.com/${h}`,             de: /(?:x|twitter)\.com\/([^/?#\s]+)/i,     ok: /^\w{1,15}$/ },
    instagram: { nome: "Instagram", cor: "#f56fa1", url: h => `https://www.instagram.com/${h}`, de: /instagram\.com\/([^/?#\s]+)/i,         ok: /^[\w.]{1,30}$/ },
    tiktok:    { nome: "TikTok",    cor: "#25f4ee", url: h => `https://www.tiktok.com/@${h}`,   de: /tiktok\.com\/@([^/?#\s]+)/i,           ok: /^[\w.]{2,24}$/ },
  };
  function arroba(rede, v) {   // "meito", "@meito" ou o link -> "meito"; null se não der para entender
    v = String(v || "").trim();
    if (!v) return "";
    const m = v.match(REDES[rede].de);
    v = (m ? m[1] : v).replace(/^@/, "");
    return REDES[rede].ok.test(v) ? v : null;
  }
  const linkRede = (rede, h, extra = "") => `<a class="rede" href="${esc(REDES[rede].url(h))}" target="_blank" rel="noopener" style="--rc:${REDES[rede].cor}" ${extra}>${REDES[rede].nome}</a>`;
  function secReferencias() {
    const refs = referencias();
    const novo = EDITAR ? `<div class="barra"><button class="btn" id="ref-nova">+ adicionar referência</button></div>` : "";
    if (!refs.length) return novo + `<div class="painel vazio">${EDITAR ? "Adicione os monos de Karthus que você recomenda: nick com a tag, região, por que vale a pena assistir e as redes de cada um."
                                                                     : "Em breve: os monos de Karthus que o polgarlol recomenda acompanhar."}</div>`;
    const noAr = r => VIVO[((r.redes || {}).twitch || "").toLowerCase()];
    const ordem = refs.map((r, i) => [r, i]).sort((a, b) => !!noAr(b[0]) - !!noAr(a[0]));   // quem está ao vivo aparece primeiro
    return novo + `<div class="refs">${ordem.map(([r, i]) => { const [nome, tag] = r.nick.split("#"), redes = r.redes || {}, vivo = noAr(r);
      return `<article class="ref${vivo ? " no-ar" : ""}">

          ${vivo ? `<a class="vivo-ref" href="${esc(REDES.twitch.url(redes.twitch))}" target="_blank" rel="noopener" title="Assistir agora na Twitch"><i></i>ao vivo · ${esc(vivo)}</a>` : ""}</div>
        ${r.nota ? `<p>${esc(r.nota)}</p>` : ""}
        <div class="ref-links"><a class="rede" href="${esc(opgg(r))}" target="_blank" rel="noopener" style="--rc:#5383e8" title="Perfil e partidas no op.gg">op.gg</a>
          ${Object.keys(REDES).filter(k => redes[k]).map(k => linkRede(k, redes[k])).join("")}
          ${r.link ? `<a class="rede" href="${esc(r.link)}" target="_blank" rel="noopener">link</a>` : ""}</div>
        ${EDITAR ? `<div class="ref-acoes">${i ? `<button class="btn sec mini" data-ref-subir="${i}" title="Mostrar antes">↑ subir</button>` : ""}
          <button class="btn sec mini" data-ref="${i}">editar</button></div>` : ""}</article>`; }).join("")}</div>`;
  }
  async function gravarReferencias(lista) {

  function editarReferencia(i) {

        <div class="vazio" style="font-size:13px;margin-top:4px">Com a tag certa o op.gg abre direto no perfil dele.</div></div>
      <div class="bloco"><span class="rot">Região</span><div class="seg" id="ref-regiao" style="flex-wrap:wrap">${REGIOES.map(g => `<button data-g="${g}" class="${r.regiao === g ? "on" : ""}">${g}</button>`).join("")}</div></div>
      <div class="bloco"><span class="rot">Por que acompanhar (opcional)</span><textarea class="campo" id="ref-nota" maxlength="300" style="min-height:80px" placeholder="ex.: ótimo clear, sabe a hora certa do R">${esc(r.nota)}</textarea></div>

      const novas = {};
      for (const inp of dlg.querySelectorAll("[data-rede]")) {

  function secMatchups() {
    const todas = matchups();
    const temJg = todas.some(m => ehJungler(m.id));
    if (filtroMu === null) filtroMu = temJg || !todas.length ? "junglers" : "todos";   // o Karthus dele é de selva: começa pelos junglers
    const lista = (filtroMu === "junglers" ? todas.filter(m => ehJungler(m.id)) : todas)
      .sort((a, b) => (b.dificuldade || 0) - (a.dificuldade || 0) || a.campeao.nome.localeCompare(b.campeao.nome, "pt"));
    const niveis = [1, 2, 3, 4, 5].map(n => ({ n, cs: lista.filter(m => m.dificuldade === n) })).filter(x => x.cs.length);
    const edicao = EDITAR ? `<button class="btn" id="novo">+ escrever guia</button><button class="btn sec" id="rapido">${rapido ? "fechar classificação" : "classificar rápido"}</button>` : "";
    let html = `<div class="barra"><div class="seg" id="filtro-mu"><button data-f="junglers" class="${filtroMu === "junglers" ? "on" : ""}">Junglers</button>

      ? "Nenhum guia ainda. Comece por <b>classificar rápido</b> para dar a dificuldade de cada jungler; depois escreva os guias completos em <b>+ escrever guia</b>."
      : "Os guias estão sendo escritos. Enquanto isso, pergunte no chat: <b>!vs</b> e o nome do campeão."}</div>`;
    if (niveis.length) html += `<div class="painel">${niveis.map(x => `<div class="nivel" style="--cor:${COR[x.n]}"><span class="nome">${NIVEL[x.n]}</span>
      <div class="camps">${x.cs.map(m => `<a href="#vs-${m.id}" title="${esc(m.campeao.nome)}"><img src="${iconeCampeao(m.id)}" alt="${esc(m.campeao.nome)}" loading="lazy"></a>`).join("")}</div></div>`).join("")}</div>`;
    html += `<div class="barra" style="margin-top:14px"><input class="busca" id="busca-mu" placeholder="Buscar campeão…" autocomplete="off"></div>

  function secRunas(d) {

      </div><div>
        <div class="arvore">${img(d.secundaria)}${esc(d.secundaria.nome)}</div>
        ${r.slice(4, 6).map(x => `<div class="runa">${img(x)}${esc(x.nome)}</div>`).join("")}

      </div></div>`;

  function secBuild(d) {
    if (!d) return `<div class="painel vazio">A build mais usada aparece aqui assim que o LoL abrir durante a live.</div>`;
    if (!(d.itens || []).length) return `<div class="painel vazio">${d.ao_vivo ? "Nenhum item comprado ainda nesta partida." : "Sem itens para mostrar."}</div>`;

  function anel(p) {
    const c = 2 * Math.PI * 46;
    return `<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--linha)" stroke-width="9"/>
      <circle cx="55" cy="55" r="46" fill="none" stroke="var(--borda)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/></svg>`;
  }
  function secStats(d) {
    const k = d.karthus, r = d.ranqueada;

        <div><div class="pct">${pct(k.v, k.jogos)}%</div><div><span class="v">${k.v}V</span> · <span class="d">${k.jogos - k.v}D</span></div>
        <div class="vazio">KDA ${k.k} / ${k.d} / ${k.a} · melhor ${esc(k.melhor)}</div></div></div></div>` : "";
    const temporada = r ? `<div class="painel"><div class="rot">${esc(r.fila)} na temporada</div><div class="wr" style="margin-top:10px">${anel(pct(r.v, r.v + r.d))}
        <div><div class="pct">${pct(r.v, r.v + r.d)}%</div><div><span class="v">${r.v}V</span> · <span class="d">${r.d}D</span></div></div></div></div>` : "";
    const ult = (d.ultimas || []).map(j => `<div class="jogo">${img(j.campeao)}<span class="kda">${j.k}/${j.d}/${j.a}</span><span class="vazio">${esc(j.f)}</span>

  const CAB_MATCHUPS = `<div class="cab"><div><h2>Matchups</h2><div class="sub">O quanto cada campeão complica a vida do Karthus na selva, e o que fazer

      <nav class="abas" id="abas" aria-label="Seções">${p ? `<a href="#agora">Partida</a>` : sel ? `<a href="#agora">Seleção</a>` : ""}<a href="#matchups">Matchups</a><a href="#referencias">Referências</a>

            : sel && sel.inimigos.length ? `<section id="agora"><div class="cab"><div><h2>Seleção de campeões</h2><div class="sub">Inimigos que já apareceram. Toque num deles para ver o guia.</div></div></div>

  function redesenharMatchups() {

  }
  const CAB_REFS = `<div class="cab"><div><h2>Referências</h2><div class="sub">Monos de Karthus que vale a pena acompanhar para aprender:
    clear, rotações e a hora certa do Réquiem.</div></div></div>`;
  function redesenharReferencias() {

  function cabecalhoRolou() { const c = $("#cabecalho"); if (c) c.classList.toggle("rolou", scrollY > 24); }

  // ============================================================ fundo vivo
  let cenaSkin = null;
  function vestirCena(s) {   // troca a arte do fundo (só quando a skin muda) e centra o zoom no rosto do Karthus

    vivoTs = Date.now();
    const novo = {};

      try {
        const t = (await (await fetch(`https://decapi.me/twitch/uptime/${encodeURIComponent(l)}`)).text()).trim();
        if (!/offline|not found|error/i.test(t) && /\d+\s+(second|minute|hour|day)/i.test(t)) novo[l] = duracao(t);

  (function animarCena() {
    const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches, cenaArte = $("#cena-arte");
    // parallax: a arte anda mais devagar que a página; no PC, acompanha um pouco o mouse
    let alvoX = 0, alvoY = 0, x = 0, y = 0;
    if (!calmo) addEventListener("mousemove", ev => { alvoX = (ev.clientX / innerWidth - .5) * -14; alvoY = (ev.clientY / innerHeight - .5) * -8; }, { passive: true });
    // brasas subindo nas cores da skin (desenhadas a partir de um brilho pré-pronto: leve até no celular)
    const cv = $("#brasas"), ctx = cv.getContext("2d");
    let W = 0, H = 0, dpr = 1, brasas = [], sprites = {}, ult = performance.now();
    const rgb = v => { const h = getComputedStyle(document.documentElement).getPropertyValue(v).trim().replace("#", "");
      return h.length === 6 ? [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)) : [241, 194, 122]; };
    const sprite = c => { const k = c.join(); if (!sprites[k]) { const s = document.createElement("canvas"); s.width = s.height = 32; const g = s.getContext("2d"),
      gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, `rgba(${k},1)`); gr.addColorStop(1, `rgba(${k},0)`); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); sprites[k] = s; } return sprites[k]; };
    const nova = (inicio) => { const cores = [rgb("--acento"), rgb("--borda"), rgb("--nome2")];
      return { x: Math.random() * W, y: inicio ? Math.random() * H : H + 20 * dpr, vy: (14 + Math.random() * 30) * dpr, fase: Math.random() * 6.3,
               amp: (6 + Math.random() * 24) * dpr, r: (1 + Math.random() * 2.2) * dpr, pisca: 1.5 + Math.random() * 3, spr: sprite(cores[Math.random() < .25 ? 0 : Math.random() < .7 ? 1 : 2]) }; };
    const redim = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
      const n = calmo ? 0 : innerWidth < 640 ? 24 : 54; brasas = Array.from({ length: n }, () => nova(true)); };
    redim(); addEventListener("resize", redim);
    let tempo = 0;
    function quadro(agora) {
      const dt = Math.min(.05, (agora - ult) / 1000); ult = agora; tempo += dt;
      x += (alvoX - x) * .05; y += (alvoY - y) * .05;
      const rolagem = Math.min(scrollY * .12, innerHeight * .18);
      cenaArte.style.transform = `translate3d(${x.toFixed(1)}px, ${(y - rolagem).toFixed(1)}px, 0)`;
      ctx.clearRect(0, 0, W, H);
      for (const b of brasas) {
        b.y -= b.vy * dt; b.fase += dt * .8;

      if (!document.hidden) requestAnimationFrame(quadro);
    }

    requestAnimationFrame(quadro);

  })();

  function pintarItens() {
    const E = EST, q = semAcento(($("#ed-item-busca") || {}).value || "");
    let lista = q ? E.itens.filter(i => semAcento(i.nome).includes(q))
                  : E.itens.filter(i => (i.fim && i.preco >= 2200 && i.cat.includes("SpellDamage")) || (i.cat.includes("Boots") && i.preco >= 900) || i.cat.includes("Jungle"));
    lista = lista.filter(i => !ED.itens.includes(i.id)).slice(0, 40);
    $("#ed-itens").innerHTML = lista.map(i => `<button data-item="${i.id}" title="${esc(i.nome)}"><img src="${esc(i.icone)}" alt="" loading="lazy">${esc(i.nome)}</button>`).join("")
      || `<p class="vazio">Nenhum item com esse nome.</p>`;
  }

  function ligarEditor() {
    const e = ED, dlg = $("#dlg-editor"), lerTextos = () => { e.plano = $("#ed-plano").value; e.dica = $("#ed-dica").value;
      e.inicio_texto = $("#ed-ini-texto").value; e.build_nota = $("#ed-build-nota").value; };
    const repintar = () => { lerTextos(); const y = dlg.querySelector(".g-corpo").scrollTop; pintarEditor(); dlg.querySelector(".g-corpo").scrollTop = y; };
    $("#ed-fechar").onclick = $("#ed-cancelar").onclick = () => dlg.close();
    $("#ed-dif").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; e.dificuldade = e.dificuldade === +b.dataset.n ? 0 : +b.dataset.n; repintar(); };
    $("#ed-feit").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; const f = +b.dataset.f;
      e.feiticos = e.feiticos.includes(f) ? e.feiticos.filter(x => x !== f) : [...e.feiticos, f].slice(-2); repintar(); };
    $("#ed-prim").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; const s = +b.dataset.s;
      if (s !== e.primaria) { e.primaria = s; e.chave = 0; e.primarias = [0, 0, 0]; if (e.secundaria === s) { e.secundaria = 0; e.secundarias = []; } } repintar(); };
    if ($("#ed-sec")) $("#ed-sec").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; const s = +b.dataset.s;
      if (s !== e.secundaria) { e.secundaria = s; e.secundarias = []; } repintar(); };
    dlg.querySelectorAll("[data-linha]").forEach(div => div.onclick = ev => {
      const b = ev.target.closest("button[data-p]"); if (!b) return;
      const p = +b.dataset.p, l = div.dataset.linha;
      if (l === "chave") e.chave = e.chave === p ? 0 : p;
      else if (l[0] === "p") { const i = +l[1]; e.primarias[i] = e.primarias[i] === p ? 0 : p; }
      else if (l[0] === "f") { const i = +l[1]; e.fragmentos[i] = e.fragmentos[i] === p ? 0 : p; }
      else if (l[0] === "s") {           // secundária: 2 runas de linhas diferentes
        const sec = EST.estilos.find(s => s.id === e.secundaria), linhaDe = x => sec.linhas.findIndex(L => L.perks.includes(x));
        if (e.secundarias.includes(p)) e.secundarias = e.secundarias.filter(x => x !== p);
        else { e.secundarias = e.secundarias.filter(x => linhaDe(x) !== +l[1]); e.secundarias.push(p); if (e.secundarias.length > 2) e.secundarias.shift(); }
      }
      repintar();
    });
    if ($("#ed-limpar-runas")) $("#ed-limpar-runas").onclick = () => { Object.assign(e, { primaria: 0, chave: 0, primarias: [0, 0, 0], secundaria: 0, secundarias: [], fragmentos: [0, 0, 0] }); repintar(); };
    $("#ed-item-busca").oninput = pintarItens;
    $("#ed-itens").onclick = ev => { const b = ev.target.closest("button[data-item]"); if (!b || e.itens.length >= 7) return; e.itens.push(+b.dataset.item);
      const q = $("#ed-item-busca").value; repintar(); $("#ed-item-busca").value = q; pintarItens(); $("#ed-item-busca").focus(); };
    $("#ed-build").onclick = ev => {
      const t = ev.target.closest("[data-tirar]"), mv = ev.target.closest("[data-mover]");
      if (t) e.itens.splice(+t.dataset.tirar, 1);
      else if (mv) { const i = +mv.dataset.mover, j = i + +mv.dataset.dir; if (j >= 0 && j < e.itens.length) [e.itens[i], e.itens[j]] = [e.itens[j], e.itens[i]]; }
      else return;
      repintar();
    };
    $("#ed-campo").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; e.inicio_campo = e.inicio_campo === b.dataset.c ? "" : b.dataset.c; repintar(); };
    $("#ed-ini-texto").oninput = () => { $("#ed-ini-n").textContent = $("#ed-ini-texto").value.length; };
    $("#ed-build-nota").oninput = () => { $("#ed-build-n").textContent = $("#ed-build-nota").value.length; };
    $("#ed-plano").oninput = () => { $("#ed-plano-n").textContent = $("#ed-plano").value.length; };
    $("#ed-dica").oninput = () => { $("#ed-dica-n").textContent = $("#ed-dica").value.length; };
    $("#ed-salvar").onclick = async () => {
      lerTextos();
      const btn = $("#ed-salvar"); btn.disabled = true; $("#ed-status").textContent = "salvando…";
      try {
        MU = await salvarMatchups({ [e.id]: vazio(e) ? null : paraSalvar(e) });
        dlg.close(); redesenharMatchups(); avisar(vazio(e) ? "Guia apagado." : `Guia de ${e.nome} salvo.`);
      } catch (err) { $("#ed-status").textContent = ""; btn.disabled = false; alert(err.message || "Não consegui salvar."); }
    };
    if ($("#ed-apagar")) $("#ed-apagar").onclick = async () => {
      if (!confirm(`Apagar o guia de ${e.nome}?`)) return;
      try { MU = await salvarMatchups({ [e.id]: null }); dlg.close(); redesenharMatchups(); avisar("Guia apagado."); }
      catch (err) { alert(err.message || "Não consegui apagar."); }
    };
  }

  // ============================================================ classificar rápido (notas de 1 a 5 direto na grade)
  let pendentes = {}, tPend = null;
  function secRapido() {
    if (!EST) return `<div class="painel" style="margin-bottom:12px"><p class="vazio">carregando campeões…</p></div>`;
    const lista = EST.campeoes.filter(c => filtroMu === "todos" || ehJungler(c.id));
    return `<div class="painel" style="margin-bottom:12px"><div class="sub">Clique no número para dar a dificuldade (1 fácil … 5 pesadelo); clique de novo para tirar. Salva sozinho.
      <b id="rap-conta">${contaRapido(lista)}</b><span id="rap-status"></span></div><div class="rapido" id="rap-grade">${lista.map(c => {
        const m = MU[c.id], n = m && !m.apagado ? m.dificuldade || 0 : 0;
        return `<div class="c"><img src="${iconeCampeao(c.id)}" alt="" loading="lazy"><div style="min-width:0"><div class="n">${esc(c.nome)}</div>
          <div class="notas" data-id="${c.id}">${[1, 2, 3, 4, 5].map(k => `<button class="${n === k ? "on" : ""}" data-n="${k}" style="--cor:${COR[k]}" aria-label="${NIVEL[k]}">${k}</button>`).join("")}</div></div></div>`;
      }).join("")}</div></div>`;
  }
  function contaRapido(lista) {
    const n = lista.filter(c => MU[c.id] && !MU[c.id].apagado && MU[c.id].dificuldade).length;
    return ` ${n} de ${lista.length} ${filtroMu === "todos" ? "campeões" : "junglers"} classificados.`;
  }
  async function prepararRapido() { await estaticos(); if (rapido) redesenharMatchups(); }
  function ligarRapido() {
    const g = $("#rap-grade");
    if (!g) return;
    g.onclick = ev => {
      const b = ev.target.closest(".notas button"); if (!b) return;
      const id = +b.parentElement.dataset.id, k = +b.dataset.n, c = EST.campeoes.find(x => x.id === id);
      const atual = MU[id] && !MU[id].apagado ? MU[id] : null, nova = (atual ? atual.dificuldade : 0) === k ? 0 : k;
      const base = atual || { campeao: { id, nome: c.nome }, inicio: { campo: "", texto: "" }, feiticos: [], runas: null, itens: [], build_nota: "", plano: "", dica: "" };
      const entrada = { ...base, dificuldade: nova };
      delete entrada.atualizado;
      const ini = entrada.inicio || {};
      const semNada = !nova && !(entrada.feiticos || []).length && !entrada.runas && !(entrada.itens || []).length && !entrada.plano && !entrada.dica
                      && !ini.campo && !ini.texto && !entrada.build_nota;
      pendentes[id] = semNada ? null : entrada;
      MU[id] = semNada ? { apagado: true } : entrada;
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n === nova));
      $("#rap-conta").textContent = contaRapido(EST.campeoes.filter(c => filtroMu === "todos" || ehJungler(c.id)));
      $("#rap-status").textContent = " · salvando…";
      clearTimeout(tPend);
      tPend = setTimeout(async () => {
        const lote = pendentes; pendentes = {};
        try { MU = await salvarMatchups(lote); if ($("#rap-status")) $("#rap-status").textContent = " · salvo ✓"; }
        catch (err) { Object.assign(pendentes, lote); if ($("#rap-status")) $("#rap-status").textContent = " · não salvou: " + (err.message || "erro"); }
      }, 1500);
    };
  }

      if ($("#tw-sair")) $("#tw-sair").onclick = () => api("/api/twitch/sair", {}).then(pintar);
      if ($("#tw-ok")) $("#tw-ok").onclick = () => api("/api/twitch/iniciar", { client_id: $("#tw-cid").value }).then(pintar);
      $("#tw-testar").onclick = () => api("/api/testar", { texto: $("#tw-teste").value }).then(r => { $("#tw-resp").textContent = r.resposta + (r.resposta.startsWith("(") ? "" : "  — o cartão aparece no OBS, como no chat de verdade."); });
      if ($("#gh-sair")) $("#gh-sair").onclick = () => { if (confirm("Desligar a página na internet?")) api("/api/github/sair", {}).then(pintar); };
      if ($("#gh-ok")) $("#gh-ok").onclick = () => { $("#gh-ok").disabled = true; api("/api/github/configurar", { token: $("#gh-token").value, repo: $("#gh-repo").value }).then(pintar); };
      if ($("#gh-chave")) $("#gh-chave").onclick = () => api("/api/github/chave", {}).then(r => navigator.clipboard.writeText(r.token)).then(() => avisar("Chave copiada. Não mostre na live."), () => avisar("Não consegui copiar."));
    };
    await pintar();
  }

  // ============================================================ início e atualização
  async function atualizar(primeira) {
    try {
      const editando = $("#dlg-editor").open || $("#dlg-escolher").open || $("#dlg-ref").open || Object.keys(pendentes).length;
      const [d, mu] = await Promise.all([carregarDados(), editando ? Promise.resolve(MU) : carregarMatchups()]);
      D = d || {}; MU = mu || {};
      if (!editando) desenhar();
      checarAoVivo();
    } catch (e) {
      if (primeira) $("#app").textContent = "Não consegui carregar os dados agora. Tente de novo em instantes.";
    }
  }
  (async () => {
    carregarPatch();
    await carregarTemas();
    if (!LOCAL && token) {   // chave guardada neste aparelho: confere se ainda vale
      try {
        const r = await fetch("https://api.github.com/user", { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" });
        const u = r.ok ? await r.json() : {};
        EDITAR = (u.login || "").toLowerCase() === REPO.dono.toLowerCase();
        if (!EDITAR) { token = null; guardar.gravar("karthus.token", null); }
      } catch (e) {}
    }
    await atualizar(true);
    contarVisita();
    carregarVisitas();
    setInterval(carregarVisitas, 300000);
    setInterval(() => atualizar(false), LOCAL ? 30000 : 120000);
    if (LOCAL) setInterval(() => fetch("/api/ping").catch(() => {}), 60000);
  })();
</script>
